# Used when this ISO file is booted from another GRUB ("loopback" boot).
menuentry "Try or Install Trota OS" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} maybe-ubiquity quiet splash ---
    initrd  /casper/initrd
}
menuentry "Trota OS (safe graphics)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} maybe-ubiquity nomodeset quiet splash ---
    initrd  /casper/initrd
}
