# Trota OS @VERSION@ — boot menu of the live/installation medium.
# Works with the Canonical-signed GRUB (UEFI, Secure Boot) and with the BIOS
# El Torito image. Theme or font errors are not fatal: GRUB falls back to text.

set default=0
set timeout=10
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    set theme=/boot/grub/themes/trota/theme.txt
fi

menuentry "Try or Install Trota OS @VERSION@" --class trota --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper maybe-ubiquity quiet splash ---
    initrd  /casper/initrd
}
menuentry "Trota OS @VERSION@ (safe graphics)" --class trota --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper maybe-ubiquity nomodeset quiet splash ---
    initrd  /casper/initrd
}
menuentry "Install Trota OS @VERSION@ (no live session)" --class trota --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
    initrd  /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Boot from next volume" {
        exit 1
    }
    menuentry "UEFI firmware settings" {
        fwsetup
    }
else
    menuentry "Test memory (memtest86+)" {
        linux16 /boot/memtest86+x64.bin
    }
fi
