<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · Trota OS</title>
<meta name="description" content="{{TITLE}} del sito di Trota OS, di {{COMPANY_NAME}}.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 300 600; font-display: swap;
  src: url("fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
:root {
  --paper: #FFFFFF; --paper-2: #F5F6F7; --ink: #111316; --ink-2: #4F565D; --rule: #D9DCDF; --orange: #E2541B;
  --sans: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141619; --paper-2: #1B1E22; --ink: #E8ECEF; --ink-2: #A3AAB1; --rule: #2C3238; --orange: #FF6A2A; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.65 var(--sans); }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { border-bottom: 1px solid var(--rule); }
header .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
header svg { height: 34px; width: auto; display: block; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { .logo-dark { display: block; } .logo-light { display: none; } }
main { padding: 48px 0 72px; }
h1 { font-weight: 300; font-size: clamp(32px, 5vw, 44px); line-height: 1.1; margin: 0 0 8px; }
h2 { font-weight: 400; font-size: 22px; margin: 40px 0 10px; }
h3 { font-weight: 500; font-size: 17px; margin: 24px 0 6px; }
p, ul, table { margin: 0 0 14px; }
ul { padding-left: 20px; }
li { margin-bottom: 4px; }
.updated { color: var(--ink-2); font-size: 15px; margin-bottom: 32px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { background: var(--paper-2); font-weight: 500; }
.table { overflow-x: auto; }
footer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 28px 0; font-size: 14px; color: var(--ink-2); }
footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<header><div class="wrap">
  <a href="index.html" aria-label="Trota OS, pagina principale"><span class="logo-light">{{LOGO_LIGHT}}</span><span class="logo-dark">{{LOGO_DARK}}</span></a>
  <a href="index.html">Torna al sito</a>
</div></header>
<main class="wrap">
<h1>{{TITLE}}</h1>
<p class="updated">Aggiornata il {{UPDATED}}</p>
{{CONTENT}}
</main>
<footer><div class="wrap">
  <p>{{COMPANY_LINE}}</p>
  <p><a href="privacy.html">Privacy</a> · <a href="cookie.html">Cookie</a> · <a href="note-legali.html">Note legali</a></p>
</div></footer>
</body>
</html>
