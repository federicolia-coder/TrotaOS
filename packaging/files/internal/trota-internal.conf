# Trota OS internal edition (package trota-internal): company links shown in
# the dock, Trota Welcome (Help and support) and Trota System Info.
# KEY=value, read both by the Python apps and by /usr/bin/testard-admin (sh).

# TestardStudios admin panel (staff sign-in required).
ADMIN_URL=https://admin-common-867827762439.europe-west8.run.app/

# Where "Contact technical support" writes to.
SUPPORT_EMAIL=info@testardstudios.it

# AMBER Alerts (child abduction emergencies) from FEMA's public IPAWS feed,
# shown as notifications. auto: only when the time zone is in the United
# States, for the states of that time zone; off: never.
AMBER_ALERTS=auto
# States to follow instead of those of the time zone, e.g. AMBER_STATES=ID,OR
AMBER_STATES=
