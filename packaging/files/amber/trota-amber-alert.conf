# AMBER Alerts (child abduction emergencies) as desktop notifications, from
# FEMA's public IPAWS feed (package trota-amber-alert, docs/privacy.md).
#
# auto: only when the system time zone is in the United States, for the
# states of that time zone (no location is looked up or sent); off: never.
AMBER_ALERTS=auto
# States to follow instead of those of the time zone, e.g. AMBER_STATES=ID,OR
AMBER_STATES=
