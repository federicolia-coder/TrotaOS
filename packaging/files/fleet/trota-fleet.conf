# Trota Fleet agent configuration (package trota-fleet-agent).
# Leave empty to keep the device off any panel (the agent does not start).
# Usually written by "sudo trota-fleet-agent enroll <address> <code>", or at
# first boot by cloud-init (write_files), then: sudo systemctl restart trota-fleet-agent

# Address of the panel.
TROTA_FLEET_URL=

# One-time enrolment code created in the panel (Dispositivi → Aggiungi).
# Cleared by the agent after use.
TROTA_FLEET_TOKEN=

# yes = allow a panel on plain http:// (test networks only).
TROTA_FLEET_INSECURE=no
