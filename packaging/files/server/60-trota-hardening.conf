# Trota OS Server: SSH defaults (package trota-server-settings).
# sshd uses the first value it reads: an explicit choice made with cloud-init
# (50-cloud-init.conf, e.g. "ssh_pwauth: true") takes precedence.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
