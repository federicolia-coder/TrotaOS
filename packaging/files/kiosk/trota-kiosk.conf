# Trota OS Kiosk configuration (package trota-kiosk).
# After a change: sudo systemctl restart trota-kiosk
# The file can also be written at first boot with cloud-init (write_files).

# Page shown full screen: a web address or a local file.
TROTA_KIOSK_URL=file:///usr/share/trota-kiosk/index.html

# yes = allow Ctrl+Alt+F<n> to reach the text consoles (maintenance);
# no  = the screen shows only the kiosk page.
TROTA_KIOSK_VT_SWITCH=no
